Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: /scratch/project_462001175/paddle/output/PP-OCRv6_medium_rec_estonian_v4
  save_epoch_step: 2
  eval_batch_step: [0, 177]  # 513 should be one epoch
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt
  max_text_length: &max_text_length 128
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: /scratch/project_462001175/paddle/output/rec/predicts_ppocrv6_medium_wider.txt
  d2s_train_image_shape: [3, 96, 1536]


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 5.0e-05  # 0.00005 / 5e05 for wider run without 5e06
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: norm_edit_dis
  is_filter: false
  ignore_space: false

Train:
  dataset:
    name: MultiScaleNumericallyAugmentedDataSet
    ds_width: false
    data_dir: /tmp/archxai-estonian-split-paddle/
    ext_op_transform_idx: 1
    label_file_list:
    - /tmp/archxai-estonian-split-paddle/estonian_train.txt
    sd19_dida_dir: /tmp/synthgen/dida_segmented
    sd19_index_file: /tmp/synthgen/sd19.pkl
    sd19_curated_dir: /tmp/synthgen/curated
    sd19_backgrounds_dir: /tmp/synthgen/backgrounds
    numeric_proportion: 0.1
    additional_numeric_label_file_list:
    - /tmp/archxai-estonian-split-paddle/estonian_train_additional.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    #scales: [[1024, 48]]
    scales: [[1536, 64], [1536, 96], [1536, 128]]
    first_bs: &bs 32
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8 

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /tmp/archxai-estonian-split-paddle/
    label_file_list:
    - /tmp/archxai-estonian-split-paddle/estonian_val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 96, 1536]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 48
    num_workers: 4
